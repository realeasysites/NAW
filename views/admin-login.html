<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop login · Nappi Autoworks</title><link rel="icon" href="/images/favicon.png">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1c1d1f;font-family:system-ui,sans-serif;color:#edeeea}
form{background:#26282b;padding:32px;border-radius:6px;width:min(340px,90vw);border-top:3px solid #c9a25a}
img{width:96px;display:block;margin:0 auto 16px}
label{display:block;font-size:14px;margin:14px 0 6px}
input{width:100%;box-sizing:border-box;padding:11px;border-radius:4px;border:1px solid #44474b;background:#1c1d1f;color:#edeeea;font-size:16px}
button{margin-top:20px;width:100%;padding:12px;border:0;border-radius:4px;background:#c9a25a;color:#1c1d1f;font-weight:700;font-size:16px;cursor:pointer}
.err{color:#ff9a8a;font-size:14px;display:none;margin-top:12px}
</style></head><body>
<form method="post" action="/admin/login">
<img src="/images/logo-sm.jpg" alt="Nappi Autoworks">
<label for="u">Username</label><input id="u" name="username" autocomplete="username" required>
<label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Log in</button>
<p class="err" id="err">That username and password don't match. Try again.</p>
</form>
<script>if(location.search.includes('error'))document.getElementById('err').style.display='block'</script>
</body></html>
